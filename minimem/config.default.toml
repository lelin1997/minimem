# ============================================================
# MiniMem — 默认配置文件
# 路径: ~/.minimem/config.toml
# ============================================================
# 本文件包含所有可配置项及其默认值。
# 实际使用时只需在 ~/.minimem/config.toml 中覆盖你需要的字段。
# 推荐使用 `minimem init` 交互式生成配置。
#
# ── 必填项（5 项） ──
# 以下 5 项必须配置，否则系统无法正常工作：
#   1. llm.api_key_env     — LLM API Key 的环境变量名
#   2. llm.base_url        — LLM API 基础 URL
#   3. llm.models.heavy    — 深度推理模型（做梦/灵感）
#   4. llm.models.medium   — 结构化提取模型（事实/归纳）
#   5. llm.models.light    — 快速分类模型（门控/评分/排序）
# ──────────────────────────

[server]
host = "127.0.0.1"
port = 6677
mode = "local"              # "local" | "self-hosted"

[llm]
provider = "openai-compatible"
api_key_env = "MINIMEM_LLM_API_KEY"
# base_url — 必填，例如：
#   DeepSeek:  https://api.deepseek.com/v1
#   阿里云百炼: https://dashscope.aliyuncs.com/compatible-mode/v1
#   OpenAI:    https://api.openai.com/v1
base_url = "https://api.deepseek.com/v1"

[llm.models]
# 三级模型分层：heavy=深度推理 / medium=结构化提取 / light=快速分类
heavy = "deepseek-chat"
medium = "deepseek-chat"
light = "deepseek-chat"

[llm.embedding]
enabled = true
model = "text-embedding-v3"
dimensions = 1024

[storage]
data_dir = "~/.minimem"

